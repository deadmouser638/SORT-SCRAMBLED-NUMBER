<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sort Scramble{% endblock %} — Sorting Algorithm Visualizer</title>
    <meta name="description" content="{% block meta_desc %}Interactive sorting algorithm visualizer, benchmark engine, and live 6-way algorithm race platform for Bubble, Quick, Merge, Insertion, Selection, and Radix sort.{% endblock %}">
    <meta name="keywords" content="sorting algorithm visualizer, bubble sort, quick sort, merge sort, insertion sort, selection sort, radix sort, data structures algorithms, DSA visualizer, algorithm benchmark, algorithm race">
    <meta name="author" content="Sort Scramble">
    <meta name="robots" content="index, follow">
    <meta name="google-site-verification" content="googlee36c3136fe08020b">

    <!-- Canonical URL -->
    <link rel="canonical" href="{{ request.base_url }}">

    <!-- Open Graph / Facebook -->
    <meta property="og:site_name" content="Sort Scramble">
    <meta property="og:title" content="{% block og_title %}Sort Scramble — Interactive Sorting Algorithm Visualizer{% endblock %}">
    <meta property="og:description" content="{% block og_desc %}Visualize, compare, benchmark, and race 6 core sorting algorithms with real-time step-by-step animations.{% endblock %}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ request.base_url }}">
    <meta property="og:image" content="https://sort-scrambled-number.vercel.app/static/img/favicon.svg">

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Sort Scramble — Interactive Sorting Algorithm Visualizer">
    <meta name="twitter:description" content="Visualize, compare, benchmark, and race 6 core sorting algorithms with real-time step-by-step animations.">
    <meta name="twitter:image" content="https://sort-scrambled-number.vercel.app/static/img/favicon.svg">

    <!-- JSON-LD Structured Data for Search Engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Sort Scramble",
      "url": "https://sort-scrambled-number.vercel.app/",
      "description": "Interactive Data Structures & Algorithms (DSA) sorting visualizer, benchmark engine, and multi-algorithm race platform.",
      "applicationCategory": "EducationalApplication",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "Step-by-step sorting visualizer",
        "Performance benchmarking engine",
        "Side-by-side algorithm comparison",
        "Simultaneous 6-way algorithm race",
        "DSA educational guide with pseudocode"
      ]
    }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

    <!-- Core CSS -->
    <link rel="stylesheet" href="/static/css/nav.css?v=1.1">
    <link rel="stylesheet" href="/static/css/main.css?v=1.1">

    <!-- Page-specific CSS -->
    {% block page_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

    {% include "partials/nav.html" %}

    {% block content %}{% endblock %}

    <!-- Core JS -->
    <script src="/static/js/nav.js?v=1.1"></script>
    <script>lucide.createIcons();</script>

    <!-- Page-specific JS -->
    {% block page_js %}{% endblock %}

</body>
</html>
